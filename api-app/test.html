<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Loading Website</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
    }

    /* LOADER FULLSCREEN */
    .loader-wrapper {
      position: fixed;
      inset: 0;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .loader-wrapper.hidden {
      opacity: 0;
      visibility: hidden;
    }

    /* LOGO */
    .logo-loader {
      width: 120px;
      animation: pulseRotate 1.8s infinite ease-in-out;
      filter: drop-shadow(0 0 15px rgba(31, 79, 163, 0.5));
    }

    /* TEXT */
    .loading-text {
      margin-top: 16px;
      font-size: 14px;
      letter-spacing: 3px;
      color: #1f4fa3;
      animation: fadeText 1.5s infinite;
    }

    /* ANIMATIONS */
    @keyframes pulseRotate {
      0% {
        transform: scale(0.9) rotate(0deg);
        opacity: 0.6;
      }
      50% {
        transform: scale(1.05) rotate(180deg);
        opacity: 1;
      }
      100% {
        transform: scale(0.9) rotate(360deg);
        opacity: 0.6;
      }
    }

    @keyframes fadeText {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }

    /* KONTEN WEBSITE (CONTOH) */
    .content {
      padding: 40px;
      text-align: center;
    }
  </style>
</head>

<body>

  <!-- LOADER -->
  <div class="loader-wrapper" id="loader">
    <img src="logo.png" alt="Logo Loading" class="logo-loader">
    <div class="loading-text">LOADING</div>
  </div>

  <!-- KONTEN WEBSITE -->
  <div class="content">
    <h1>Website Siap Digunakan 🚀</h1>
    <p>Ini adalah konten utama website kamu.</p>
  </div>

  <!-- SCRIPT -->
  <script>
    window.addEventListener("load", function () {
      const loader = document.getElementById("loader");
      setTimeout(() => {
        loader.classList.add("hidden");
      }, 800); // delay sedikit biar animasi smooth
    });
  </script>

</body>
</html>
